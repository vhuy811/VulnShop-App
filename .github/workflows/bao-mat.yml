name: Bao mat

# Repo nay KHONG chua pipeline. No goi pipeline dung chung o repo
# vhuy811/DevSecOps_VHNAT. Sua pipeline o do, moi repo goi toi deu nhan.
#
# main la ban SACH: bon lo hong co y da duoc va, ban goc giu o tag `ground-truth`.
# AI CHAN MERGE: GitHub, qua ruleset "Require code scanning results" - chi tinh
# alert MOI trong PR so voi main. Job nay chi quet va day ket qua len, khong chan.

# Chi quet khi MO PR va khi push vao main. Khong quet moi push len nhanh phu:
# neu quet ca hai, mot commit tren PR se co HAI check cung ten "security / scan"
# so voi hai moc khac nhau (nhanh vs main), va ruleset chon cai nao la may rui.
# Mot PR - mot check - mot moc. Nhanh phu muon duoc quet thi mo PR (draft cung duoc).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Bat buoc khi goi workflow khac: thieu khoi nay thi "Startup failure" ngay.
permissions:
  contents: read
  security-events: write

jobs:
  security:
    uses: vhuy811/DevSecOps_VHNAT/.github/workflows/devsecops-reusable.yml@main
    with:
      project-file: VulnShop.csproj
      health-path: /Product/List
      run-dast: true
      title: VulnShop
      # Ghim tag thay vi main khi bo cong cu da on dinh:
      # toolkit-ref: v1.0.0
    secrets: inherit
